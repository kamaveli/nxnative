name: Build NX Native IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Konfiguracja dostępu SSH do VPS
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Pobieranie kluczy i plików NSP z Twojego VPS
        run: |
          mkdir -p build_workspace
          sftp -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          get /home/ubuntu/switch/prod.keys build_workspace/
          get "/home/ubuntu/switch/Pokemon Legends Z-A.nsp" build_workspace/
          get "/home/ubuntu/switch/Pokemon Legends Z-A v2.0.2.nsp" build_workspace/
          bye
          EOF

      - name: Pobranie NX Native
        run: |
          git clone https://github.com/kpargiela/NX2Apple.git nx_source

      - name: Kompilacja i budowanie IPA dla iOS z uwzględnieniem Update
        run: |
          cd nx_source
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          
          # Pełna synchronizacja silnika wewnątrz poprawnego katalogu
          python3 tools/engine.py sync
          
          # Uruchomienie budowania bezpośrednio ze wskazaniem kluczy i plików w workspace
          python3 tools/build_shell_template.py \
            --engine "." \
            --out "../build_workspace/PokemonLegendsZA.ipa"

      - name: Odsyłanie gotowego pliku IPA z powrotem na VPS
        run: |
          sftp -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          put build_workspace/PokemonLegendsZA.ipa /home/ubuntu/switch/
          bye
          EOF

