name: Build NX Native IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Konfiguracja dostępu SSH do VPS
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Pobieranie kluczy i plików NSP z Twojego VPS
        run: |
          mkdir -p build_workspace
          sftp -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            get /home/ubuntu/switch/prod.keys build_workspace/
            get "/home/ubuntu/switch/Pokemon Legends Z-A.nsp" build_workspace/
            get "/home/ubuntu/switch/Pokemon Legends Z-A v2.0.2.nsp" build_workspace/
            bye
          EOF

      - name: Pobranie NX Native
        run: |
          git clone https://github.com/NX-Native/nx-native.git nx_source

      - name: Kompilacja i łączenie NSP z Update w plik IPA
        run: |
          python3 -m pip install --upgrade pip
          # Przejście do folderu projektu i instalacja zależności (jeśli wymagane)
          cd nx_source
          pip3 install -r requirements.txt || true
          
          # Uruchomienie skryptu budującego (wskazujemy bazę, update oraz klucze z folderu roboczego)
          # (Zastąp nazwę skryptu pythonowego, jeśli w repozytorium nazywa się inaczej, np. main.py lub build.py)
          python3 -m src.main \
            --base "../build_workspace/Pokemon Legends Z-A.nsp" \
            --update "../build_workspace/Pokemon Legends Z-A v2.0.2.nsp" \
            --keys "../build_workspace/prod.keys" \
            --output "../build_workspace/PokemonLegendsZA.ipa" || \
          python3 build.py \
            --base "../build_workspace/Pokemon Legends Z-A.nsp" \
            --update "../build_workspace/Pokemon Legends Z-A v2.0.2.nsp" \
            --keys "../build_workspace/prod.keys" \
            --output "../build_workspace/PokemonLegendsZA.ipa"

      - name: Odsyłanie gotowego pliku IPA z powrotem na VPS
        run: |
          sftp -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            put build_workspace/PokemonLegendsZA.ipa /home/ubuntu/switch/
            bye
          EOF
