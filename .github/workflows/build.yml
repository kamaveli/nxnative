name: Build NX Native IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Sprawdź Xcode
        run: ls /Applications | grep Xcode

      - name: Free Disk Space (macOS)
        run: |
          echo "=== Wolne miejsce przed czyszczeniem ==="
          df -h
          
          echo "Usuwanie zbędnych wersji Xcode i symulatorów..."
          sudo rm -rf /Applications/Xcode_[0-9]*.app
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
          
          echo "Usuwanie Android SDK i innych dużych paczek..."
          sudo rm -rf /usr/local/share/android
          sudo rm -rf /Users/runner/Library/Android/sdk
          
          echo "Czyszczenie pamięci podręcznej..."
          sudo rm -rf ~/Library/Caches/*
          sudo rm -rf /Library/Caches/*
          
          echo "=== Wolne miejsce po czyszczeniu ==="
          df -h

      - name: Konfiguracja dostępu SSH do VPS
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Pobieranie kluczy i plików gry z Twojego VPS
        run: |
          mkdir -p build_workspace/zelda
          sftp -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          get /home/ubuntu/switch/prod.keys build_workspace/zelda/
          get "/home/ubuntu/switch/The Legend of Zelda Breath of the Wild.nsz" build_workspace/zelda/
          get "/home/ubuntu/switch/The Legend of Zelda Breath of the Wild Update.nsz" build_workspace/zelda/
          get "/home/ubuntu/switch/The Legend of Zelda Breath of the Wild [DLC The Master Trials].nsz" build_workspace/zelda/
          get "/home/ubuntu/switch/The Legend of Zelda Breath of the Wild [DLC The Champions Ballad].nsp" build_workspace/zelda/
          bye
          EOF

      - name: Pobranie NX Native z submodułami
        run: |
          git clone --recursive https://github.com/LNPANDY/NX2Apple.git nx_source

      - name: Kompilacja i budowanie IPA dla iOS
        run: |
          cd nx_source
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -downloadComponent MetalToolchain || true
          brew bundle --file=Brewfile
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install lz4 capstone fonttools zbic nsz

          python3 tools/engine.py sync

          export DM_FULL_ROMFS=1
          python3 engine/scripts/build_ipa_from_nsp.py ../build_workspace/zelda -k ../build_workspace/zelda/prod.keys

          find .. -name "*.ipa" -o -name "romfs.img"

      - name: Odsyłanie gotowego pliku IPA z powrotem na VPS
        run: |
          IPA=$(find build_workspace -maxdepth 1 -name "*.ipa" -type f | head -1)
          echo "Znaleziony IPA: $IPA"
          ls -lh "$IPA"
          if [ -z "$IPA" ]; then echo "Brak pliku IPA"; exit 1; fi
          sftp -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
          put "$IPA" /home/ubuntu/switch/
          bye
          EOF

      - name: Post Konfiguracja dostępu SSH do VPS
        if: always()
        run: echo "Zakończono proces przesyłania."

